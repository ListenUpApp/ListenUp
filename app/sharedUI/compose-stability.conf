// Types the Compose compiler cannot see into, declared stable so composables compare them with
// equals() instead of identity. They come from modules the Compose compiler does not process
// (:app:sharedLogic, :contract), so without this every one is inferred unstable, and each fresh
// copy a Room or sync flow emits recomposes everything it reaches, even when nothing changed.
//
// List a package here only once every type in it is immutable: data, value, enum or sealed types
// whose properties are all `val`s of immutable types, with no `var`, no mutable collection and no
// observable internal state. Check again before adding a type with an array: the one listed today
// (PendingCover, in domain.model) compares its bytes by content and is never mutated in place.
// UI-state and ViewModel packages are deliberately absent: they hold ViewModels, TextFieldState
// and lambdas.

// Read-only collection interfaces. Every list, set and map handed to a composable is built by a
// ViewModel or repository and never mutated after it is emitted.
kotlin.collections.*

// :app:sharedLogic domain models.
com.calypsan.listenup.client.domain.model.*
com.calypsan.listenup.client.domain.chapter.*
com.calypsan.listenup.client.domain.leaderboard.*
com.calypsan.listenup.client.domain.readers.*

// :contract wire types: @Serializable data classes, enums and sealed hierarchies of vals.
com.calypsan.listenup.api.dto.**
com.calypsan.listenup.api.metadata.*
