# SwiftLint — idiomatic-best-practices baseline for the native iOS app.
#
# Philosophy (per team direction): relax noisy *style* defaults to SwiftUI-realistic
# levels, ADD high-value correctness/best-practice opt-in rules (the genuine signal),
# and fix what genuinely should be fixed. CI runs non-strict: error-severity violations
# gate the build; warnings are advisory. Linux-friendly (no analyzer-only rules — the
# Lint job runs `swiftlint lint`, not `analyze`).

included:
  - ListenUp
  - ListenUpTests
  - ListenUpWidgets
  - ListenUpActivityKit
  - ListenUpNotificationService

excluded:
  - ListenUp/Preview Content

# ── Tuned default rules: relax SwiftUI / Swift idiom noise, keep them meaningful ──

identifier_name:
  # 2-char names like `id`, `ms`, `db` are idiomatic; single-char loop/math vars allowed.
  min_length:
    warning: 2
    error: 1
  excluded: [id, x, y, z, i, j, to, ok, vm, ms, db, ui, os, ns, dx, dy, r, g, b, a, w, h]

line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

large_tuple:
  # RGB triples (BlurHash) + small test-record tuples are idiomatic; 4+ wants a struct.
  warning: 3
  error: 4

# SwiftUI Views and cohesive coordinators legitimately run long — realistic limits that
# still catch genuine bloat. (FullScreenPlayerView / PlayerCoordinator size is tracked
# for refactor in docs/superpowers/followups.md, not papered over here.)
function_body_length:
  warning: 60
  error: 120
type_body_length:
  warning: 400
  error: 550
file_length:
  warning: 550
  error: 800
cyclomatic_complexity:
  warning: 12
  error: 20

disabled_rules:
  # SwiftUI idiom: trailing-closure + trailing content/label closure (e.g.
  # `Button { … } label: { … }`, `.sheet(isPresented:) { … }`) — a false positive
  # for declarative UI.
  - multiple_closures_with_trailing_closure

# ── High-value opt-in rules: the genuine best-practice / correctness signal ──
opt_in_rules:
  - empty_count
  - empty_string
  - empty_collection_literal
  - first_where
  - last_where
  - contains_over_first_not_nil
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - sorted_first_last
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - unused_optional_binding
  - closure_spacing
  - explicit_init
  - fatal_error_message
  - yoda_condition
  - prefer_self_type_over_type_of_self
  - joined_default_parameter
  - literal_expression_end_indentation
  - operator_usage_whitespace

# ── Guards: HIG conformance the compiler can't see ──
custom_rules:
  # `.swipeActions` only fires on a row inside a `List` (or a `Form`, which is one). Attached to a
  # row in a `ScrollView`/`VStack` it compiles, renders nothing, and silently strands the action —
  # which is how signing out a single device and deleting an import became impossible
  # (2026-09-29 iOS audit, P0). HIG, Lists and tables.
  #
  # The heuristic is file-level and deliberately cheap: a file that uses `.swipeActions` must also
  # contain a `List` or `Form` (`List {`, `List(`, `Form {`). SwiftLint custom rules can't see across
  # files, so a row view that lives in its own file and is hosted by a `List` elsewhere declares
  # that host with a `// swipe-actions-host: <File>.swift` comment. The regex anchors at the start
  # of the file, so the violation is reported on line 1 rather than at the modifier.
  swipe_actions_outside_list:
    name: "Swipe actions outside a List"
    regex: '(?s)\A(?!.*(?:\b(?:List|Form)\s*[({]|swipe-actions-host:)).*?\.swipeActions\b'
    message: >-
      .swipeActions only works on rows inside a List or Form. Host the rows in a List, or — for a
      row view hosted by a List in another file — add `// swipe-actions-host: <File>.swift`.
    severity: error

  # Raw colour literals live in `ListenUp/DesignSystem/` only. A `Color(hex:)` or `Color(red:…)` in a
  # screen is a static sRGB value with no dark, no Increase Contrast and no contrast check — which is
  # how a 3.55:1 coral, 2.33:1 import avatars and six copies of one hex palette reached the app
  # (2026-09-29 iOS audit, theming). HIG, Color: "If you define a custom color, make sure to supply
  # light and dark variants, and an increased contrast option for each variant". Screens name a
  # token (`Color.luTint`, `.luWarning`, `AvatarPalette`, `Color+Palette`) or a system colour; a new
  # colour is added to DesignSystem, as a Color Set or a solved token, with its contrast tested.
  # Paths are regexes: `/ListenUp/` covers the app target only (not ListenUpTests or the widgets).
  raw_color_literal_outside_design_system:
    name: "Raw colour literal outside DesignSystem"
    regex: '\b(?:UI)?Color\(\s*(?:\.sRGB\s*,\s*)?(?:hex|red)\s*:'
    included: '/ListenUp/'
    excluded: '/ListenUp/DesignSystem/'
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
      - string
    message: >-
      Colour literals belong in ListenUp/DesignSystem/. Use a design-system token (luTint, luWarning,
      AvatarPalette, Color+Palette) or a system colour, or add a tested token there.
    severity: error

  # Library's sections were a swipe pager (`.tabViewStyle(.page)`) under a hand-drawn chip row: the
  # sections hid behind a gesture, the chips drew their own selection, and VoiceOver heard neither
  # as a set of choices (2026-09-29 iOS audit, conformance). A set of closely related views is a
  # segmented `Picker`; separate sections of the app are tabs. HIG, Segmented controls: "consider a
  # segmented control to switch between closely related subviews … for switching between completely
  # separate sections of an app, use a tab bar instead." Nothing in the app pages today; a genuine
  # page-by-page content viewer would be the exception to argue for here.
  page_tab_view_style:
    name: "Paged TabView"
    regex: '\.tabViewStyle\(\s*\.page\b'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: >-
      Switch closely related views with a segmented Picker, and separate sections with tabs — not a
      swipe pager (HIG, Segmented controls).
    severity: error

  # A bottom tray painted with `.background(.bar)` inside `safeAreaInset` draws a flat strip where the
  # system now draws a scroll-edge effect for its bars (2026-09-29 iOS audit, theming: 11 sites). A
  # bar over a scroll view is `.safeAreaBar(edge:)`, which gets that effect for free. HIG, Toolbars.
  painted_bar_background:
    name: "Painted bar background"
    regex: '\.background\(\s*\.bar\s*\)'
    excluded_match_kinds:
      - comment
      - doccomment
      - string
    message: >-
      Put the tray in `.safeAreaBar(edge:)` instead of painting `.background(.bar)` behind it — the
      system draws the bar's scroll-edge effect (HIG, Toolbars).
    severity: error
