# Keeps the OSS license manifests (app/sharedUI/.../aboutlibraries.json and app/webApp/web/public/licences.json)
# in sync with the dependency catalog and web lockfile automatically. Dependabot bumps dependencies
# without regenerating the manifests — which fails `verifyLicenses` / `verifyWebLicences` on main.
# This workflow regenerates both and opens a fix PR whenever either drifts.
#
# Runs on: a dependency/build change landing on main, or on demand via workflow_dispatch.
name: Regenerate License Manifest

on:
  push:
    branches: [main]
    paths:
      - 'gradle/libs.versions.toml'
      - '**/build.gradle.kts'
      - 'app/webApp/web/package.json'
      - 'app/webApp/web/pnpm-lock.yaml'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate-licenses
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate license manifests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/webApp/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/webApp/web/pnpm-lock.yaml

      - name: Install JS toolchain
        working-directory: app/webApp/web
        run: pnpm install --frozen-lockfile

      # Rewrites both committed manifests in place from the current dependency graphs:
      # - app/sharedUI/src/commonMain/composeResources/files/aboutlibraries.json
      # - app/webApp/web/public/licences.json
      - name: Regenerate license manifests (Linux is authoritative)
        run: ./gradlew :app:sharedUI:exportLibraryDefinitions :app:webApp:mergeWebLicences --no-daemon

      - name: Open a fix PR if any manifest drifted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ANDROID_MANIFEST="app/sharedUI/src/commonMain/composeResources/files/aboutlibraries.json"
          WEB_MANIFEST="app/webApp/web/public/licences.json"

          if git diff --quiet -- "$ANDROID_MANIFEST" "$WEB_MANIFEST"; then
            echo "License manifests already in sync with the dependency graphs — nothing to do."
            exit 0
          fi

          echo "Manifest drifted — opening a regeneration PR."
          BRANCH="chore/regenerate-licenses-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$ANDROID_MANIFEST" "$WEB_MANIFEST"
          git commit -m "🔖 chore(licenses): regenerate OSS license manifests for dependency changes"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "🔖 chore(licenses): regenerate OSS license manifests (dependency bump)" \
            --body "Automated — a dependency change altered the OSS license set, so \`exportLibraryDefinitions\` / \`mergeWebLicences\` regenerated the manifest(s). Merging this makes \`verifyLicenses\` and \`verifyWebLicences\` pass again."
