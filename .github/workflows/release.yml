# ListenUp Client — Release Pipeline
#
# Manual, per-platform release. Version comes from the VERSION file; the optional
# `version` input bumps it (commits; the tag is cut by the last job, once every
# selected lane has succeeded). Android → Play internal,
# iOS → TestFlight, server → GHCR.
#
# Every lane stops one step short of the public: promotion to Play production and
# submission to App Store review are both deliberate, manual acts.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (blank = use current VERSION file)"
        required: false
        type: string
      android:
        description: "Release Android"
        type: boolean
        default: true
      ios:
        description: "Release iOS (TestFlight)"
        type: boolean
        default: true
      server:
        description: "Release server (GHCR)"
        type: boolean
        default: true
      ios_dry_run:
        description: "iOS signing dry run: archive + export an IPA, no TestFlight upload, no GitHub Release"
        type: boolean
        default: false
      skip_ci_check:
        description: "Release even though CI is not green on this commit (say why in the run notes)"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  set-version:
    name: Resolve version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The release used to build whatever main held, green or not: nothing looked at CI. A red main
      # shipped is a red build on every tester's phone. The override exists because CI itself can be
      # the thing that is broken (a flaky lane, an outage) while the code is fine. The self-test runs
      # first so a gate that has stopped refusing cannot pass silently.
      - name: Require a green CI run on this commit
        if: ${{ !inputs.skip_ci_check }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/scripts/require-green-ci.test.sh
          bash tools/scripts/require-green-ci.sh

      - name: Resolve and (optionally) bump version
        id: resolve
        run: |
          set -euo pipefail
          INPUT="${{ inputs.version }}"
          if [ -n "$INPUT" ] && [ "${{ inputs.ios_dry_run }}" = "true" ]; then
            echo "::error::An iOS dry run ships nothing, so it must not bump VERSION or tag. Leave version blank."
            exit 1
          fi
          if [ -n "$INPUT" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::A version bump commits to main, so it must be dispatched on main (this run is on ${GITHUB_REF})."
            exit 1
          fi
          if [ -n "$INPUT" ]; then
            CLEAN="${INPUT#v}"
            if git rev-parse -q --verify "refs/tags/v$CLEAN" >/dev/null; then
              echo "::error::Tag v$CLEAN already exists: that version was released. Pick the next version, or leave version blank to re-run lanes for it."
              exit 1
            fi
            echo "$CLEAN" > VERSION
            # Keep the README status badge in step with VERSION. It is carried in the same
            # commit deliberately: hand-updating it drifted six releases (0.6.0 while shipping
            # 0.8.6), because nothing failed when it was forgotten.
            sed -i -E \
              -e "s|status-beta%20v[0-9]+\.[0-9]+\.[0-9]+-orange|status-beta%20v$CLEAN-orange|" \
              -e "s|alt=\"Beta v[0-9]+\.[0-9]+\.[0-9]+\"|alt=\"Beta v$CLEAN\"|" \
              README.md
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add VERSION README.md
            # Re-dispatching the same version after a failed lane finds VERSION already bumped: there is
            # nothing to commit, and that is fine — the tag below this job is what marks a release, and it
            # is created only once every selected lane has succeeded.
            if git diff --cached --quiet; then
              echo "VERSION already says $CLEAN; nothing to commit."
            else
              git commit -m "🔖 chore: release v$CLEAN"
              git push origin HEAD:main
            fi
            VERSION="$CLEAN"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          SHA="$(git rev-parse HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $VERSION (sha $SHA)"

  android:
    name: Android → Play (internal/draft)
    runs-on: ubuntu-latest
    needs: set-version
    if: ${{ inputs.android && !inputs.ios_dry_run }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.set-version.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # AGP needs the NDK to strip the AndroidX .so files and to extract the native symbol tables Play
      # reads from the AAB. The runner image does not carry the version AGP pins, and without it the build
      # silently packages unstripped libraries ("Unable to strip"). The version lives in libs.versions.toml.
      - name: Install the Android NDK
        run: |
          ndk_version="$(sed -n 's/^android-ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$ndk_version"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ndk_version}" > /dev/null

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/release.keystore

      - name: Build signed AAB + APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:androidApp:bundleRelease :app:androidApp:assembleRelease --no-daemon

      # Gate the artifact before it can reach Play. kotlinx.rpc ships no consumer R8
      # rules and resolves @Rpc services by interface name, so a missing keep rule
      # silently produces a build that cannot reach ANY server. 0.8.0 shipped that way.
      - name: Verify @Rpc surface survived R8
        run: tools/scripts/verify-r8-rpc-surface.sh app/androidApp/build/outputs/apk/release/androidApp-release.apk

      # `completed`, not `draft`. A draft is created in Play Console and rolled out to nobody —
      # not even internal testers — until someone opens the Console and starts the rollout by
      # hand. That made Android the only lane whose output went nowhere on its own (iOS reaches
      # TestFlight, the server reaches GHCR), and it is not a hypothetical cost: the Android Auto
      # fix in v0.8.7 sat undelivered behind this while Google re-reviewed v0.8.6 (version code
      # 2790) and rejected it a second time for the very bug that had already been fixed.
      # `completed` on the internal track is the true analogue of TestFlight — delivered to a
      # small closed group, with promotion to production still deliberate and manual.
      - name: Upload to Google Play (internal)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.calypsan.listenup.client
          releaseFiles: app/androidApp/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      # Says the quiet part out loud. Reaching the internal track is NOT the same as reaching a
      # policy reviewer: Play reviews what is submitted to production, so a fix that stops at
      # internal is invisible to review no matter how many times it is released. The step that
      # was missed for three consecutive releases is the one this prints.
      - name: Note what still needs a human
        run: |
          {
            echo "### Android → Play internal track ✅"
            echo
            echo "Version code: \`$(git rev-list --count HEAD)\` · version: \`${{ needs.set-version.outputs.version }}\`"
            echo
            echo "**Still manual, and still required for a policy review:** promote this release"
            echo "to **production** in Play Console. A build that stops at the internal track is"
            echo "never reviewed, and any older production build remains the one Google re-reviews."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts for GitHub Release
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            app/androidApp/build/outputs/bundle/release/*.aab
            app/androidApp/build/outputs/apk/release/*.apk
          retention-days: 30

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [set-version, android, ios, server]
    # Publish only after every SELECTED platform succeeded. always() lets this
    # job run past deselected (skipped) needs; each clause then requires the
    # platform's success only when its boolean input selected it.
    if: >-
      always() &&
      inputs.ios_dry_run == false &&
      needs.set-version.result == 'success' &&
      (inputs.android == false || needs.android.result == 'success') &&
      (inputs.ios == false || needs.ios.result == 'success') &&
      (inputs.server == false || needs.server.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        if: ${{ inputs.android && needs.android.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.set-version.outputs.version }}
          name: v${{ needs.set-version.outputs.version }}
          # The tag does not exist yet on a bumped release: this action creates it, on the commit every
          # lane built. Tagging first (as this workflow did) left v-tags on main for releases that failed.
          target_commitish: ${{ needs.set-version.outputs.sha }}
          generate_release_notes: true
          files: artifacts/**/*
          fail_on_unmatched_files: false

  ios:
    name: iOS → TestFlight
    runs-on: xcode-27
    needs: set-version
    if: ${{ inputs.ios }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.set-version.outputs.sha }}

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '27.1'

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Read Kotlin version for Konan cache key
        id: kotlin-version
        run: |
          version="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-v1-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Import distribution certificate
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"

      # Every archive below mints an Apple Development certificate: automatic signing wants a
      # development identity, a fresh runner never has one, and `-allowProvisioningUpdates`
      # creates one through the ASC API key. The private key dies with the runner, so the
      # certificates pile up until Apple's cap refuses the next one — which is how the 0.9.6
      # release died on "Choose a certificate to revoke". (Ad hoc archiving can't avoid it:
      # the app group, aps-environment and CarPlay entitlements require development signing.)
      # So before archiving, revoke the development certificates earlier runs minted — the
      # API names them "Created via API"; certificates made in Xcode or the portal, and every
      # distribution certificate, are never touched. Best effort: never fails the release.
      - name: Revoke development certificates minted by earlier runs
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8" | base64 -d > "$ASC_KEY_PATH"
          python3 .github/scripts/revoke_ci_dev_certs.py

      # Apple-native build → upload. `xcodebuild -exportArchive` with destination=upload
      # in ExportOptions.plist delivers the build to App Store Connect / TestFlight directly,
      # authenticated by the ASC API key. `-allowProvisioningUpdates` lets xcodebuild manage
      # signing via that key (no manual provisioning profile needed). No Ruby/Fastlane.
      # A dry run swaps the destination to `export` and inspects the signed IPA instead.
      - name: Archive, export & upload to TestFlight
        working-directory: app/iosApp
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MARKETING_VERSION: ${{ needs.set-version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          DRY_RUN: ${{ inputs.ios_dry_run }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8" | base64 -d > "$KEY_PATH"
          ARCHIVE="$RUNNER_TEMP/ListenUp.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/export"

          xcodebuild archive \
            -scheme ListenUp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          EXPORT_OPTIONS="ExportOptions.plist"
          if [ "$DRY_RUN" = "true" ]; then
            EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.dry-run.plist"
            cp ExportOptions.plist "$EXPORT_OPTIONS"
            plutil -replace destination -string export "$EXPORT_OPTIONS"
          fi

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT_DIR" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates

          if [ "$DRY_RUN" = "true" ]; then
            # What TestFlight would have received: the signing identity and entitlements of
            # the app and every extension (expect Apple Distribution, aps-environment
            # production, the app group, CarPlay audio, associated domains).
            unzip -q "$EXPORT_DIR"/*.ipa -d "$RUNNER_TEMP/ipa"
            {
              echo "### iOS signing dry run — not uploaded"
              find "$RUNNER_TEMP/ipa/Payload" -maxdepth 3 \( -name '*.app' -o -name '*.appex' \) | while read -r bundle; do
                echo
                echo "#### $(basename "$bundle")"
                echo '```'
                codesign -dvv "$bundle" 2>&1 | grep -E '^(Authority|TeamIdentifier|Identifier)=' || true
                codesign -d --entitlements - --xml "$bundle" 2>/dev/null | plutil -convert xml1 -o - - || true
                echo '```'
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  server:
    name: Server → GHCR
    # Pin to 24.04 so the builder's glibc matches what the runtime image provides:
    # Dockerfile.native builds against debian:13-slim and runs on
    # gcr.io/distroless/cc-debian13:nonroot (glibc 2.41). The dynamically-linked
    # server.kexe would fail to start on an older-glibc base with "GLIBC_x.y not found".
    runs-on: ubuntu-24.04
    needs: set-version
    if: ${{ inputs.server && !inputs.ios_dry_run }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.set-version.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Read Kotlin version for Konan cache key
        id: kotlin-version
        run: |
          version="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Konan (Kotlin/Native)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-v1-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-v1-
            ${{ runner.os }}-konan-

      # Dev packages provide the libargon2.so / libsqlite3.so / libcurl.so symlinks the K/N linker
      # resolves via -largon2 / -lsqlite3 / -lcurl (against -L/usr/lib). The runtime image installs the
      # .so.N siblings (libargon2-1, libsqlite3-0, libcurl4) for execution. Using the repo apt-install
      # action also configures the mirror/timeout policy and disables flaky third-party sources ahead
      # of Playwright's install-deps below.
      - name: Install native link dependencies
        timeout-minutes: 18
        uses: ./.github/actions/apt-install
        with:
          packages: libargon2-dev libsqlite3-dev libcurl4-openssl-dev

      - name: Build native server binary (server.kexe)
        run: ./gradlew :server:linkReleaseExecutableLinuxX64 --no-daemon

      - name: Stage binary for Docker
        run: cp server/build/bin/linuxX64/releaseExecutable/server.kexe server/server-binary

      # Same toolchain pins as ci.yml's web jobs — one pnpm/Node version across every lane that
      # builds this bundle, so the artifact a release ships is the artifact CI tested.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/webApp/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/webApp/web/pnpm-lock.yaml

      # Before the Playwright step, because `pnpm exec` needs node_modules. Gradle's own
      # `webPnpmInstall` (a `webBundle` dependency) runs later and finds this up to date.
      - name: Install JS toolchain
        working-directory: app/webApp/web
        run: pnpm install --frozen-lockfile

      - name: Read Playwright version for browser cache key
        id: playwright-version
        working-directory: app/webApp/web
        run: |
          version="$(node -p "require('./node_modules/playwright/package.json').version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-v1-${{ steps.playwright-version.outputs.version }}

      # ⛔ `webBundle` ends in `prod-boot.mjs`, which does `chromium.launch()` — so the browser
      # binaries have to be here, and `pnpm install` fetches the playwright PACKAGE, not them. Same
      # step and pins as ci.yml's two web jobs. Without it the release fails at the bundle step; it
      # passed locally only because a dev machine already has the download from `webKotest`.
      - name: Install Playwright Chromium
        working-directory: app/webApp/web
        timeout-minutes: 12
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # The web client the image serves. `webBundle` runs `pnpm build:check`, which boots the built
      # bundle before it can be staged — an image whose web client cannot start never gets built.
      #
      # ⛔ Without this step the release shipped no web client at all. The platform was built and
      # gated in CI (test-web-browser, test-web-browser-server) and then omitted from every image,
      # because nothing here ever produced a production bundle.
      - name: Build the production web bundle
        run: ./gradlew :app:webApp:webBundle --no-daemon

      - name: Stage web bundle for Docker
        run: cp -r app/webApp/web/dist server/web-dist

      # The release must not ship a binary whose own native test suite was never run. The aarch64-
      # free link dependencies this needs are already installed above.
      - name: Run :server linuxX64 tests
        run: ./gradlew :server:linuxX64Test --no-daemon

      # Build the image locally and boot it BEFORE anything is pushed. Nothing had ever run the
      # artifact we publish: Dockerfile.native's own header records a dropped FTS5 flag shipping an
      # image that died on first boot — "a release-blocking break that CI could not see, because CI
      # never builds this image". This is that gate. The push step below rebuilds from the same
      # context on the same daemon and reuses this build's layer cache.
      - name: Build image locally for the boot smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          file: server/Dockerfile.native
          push: false
          load: true
          tags: listenup-server:smoke

      # Hard release gate: an image that cannot reach a healthy /healthz never reaches GHCR. The
      # expected version is asserted too, so a stale layer cannot pass itself off as this build.
      - name: Boot-test the image (serve-smoke.sh)
        env:
          EXPECTED_VERSION: ${{ needs.set-version.outputs.version }}
        run: bash server/scripts/serve-smoke.sh listenup-server:smoke "" "$EXPECTED_VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          file: server/Dockerfile.native
          push: true
          tags: |
            ghcr.io/listenupapp/listenup-server:${{ needs.set-version.outputs.version }}
            ghcr.io/listenupapp/listenup-server:${{ needs.set-version.outputs.sha }}
            ghcr.io/listenupapp/listenup-server:latest
