name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least-privilege GITHUB_TOKEN for every job — nothing in CI writes to GitHub.
# Matches the job-level scoping convention in release.yml.
permissions:
  contents: read

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is organized into three conceptual stages — Lint, Test, Build — each spanning the
# lanes a stage needs. Mobile-focused: Linux lane (shared Kotlin + server + Android) and
# macOS lane (iOS). Desktop has no dedicated build/test job, but test-jvm compiles
# :app:desktopApp (JVM target) so entry-point drift against shared composable signatures
# fails fast — that surface isn't otherwise touched by the Android/iOS builds.
jobs:
  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint (Spotless + Detekt)
        run: ./gradlew spotlessCheck detekt --no-daemon

      # SwiftLint runs on Linux against .swift source (no Xcode needed) via the official
      # container, pinned (0.63.3 — keep CLAUDE.md's local-commands row in sync when bumping).
      # Non-strict: error-severity violations gate; style is advisory. Config: app/iosApp/.swiftlint.yml.
      - name: Run SwiftLint (iOS)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/app/iosApp:/work" -w /work \
            ghcr.io/realm/swiftlint:0.63.3 \
            swiftlint lint --reporter github-actions-logging

      - name: Upload Detekt report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: detekt-report
          path: build/reports/detekt/
          retention-days: 7

  # ── Supply chain ─────────────────────────────────────────────────────────────
  dependency-graph:
    name: Submit dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Overrides the workflow-level `contents: read` — the dependency-graph
      # submission API writes the resolved graph back to the repository.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Review new dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # ── Test ─────────────────────────────────────────────────────────────────────
  test-web-browser:
    name: Test (web browser)
    runs-on: ubuntu-latest
    # The post-karma browser lane: KGP compiles Kotlin to ES modules, then Vite + Playwright
    # own the browser. Runs ALONGSIDE the karma lane inside Test (JVM) while the migration is
    # in flight — two lanes over the same specs means a disagreement is a signal, not a puzzle.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/webApp/web/pnpm-lock.yaml

      - name: Install JS toolchain
        working-directory: app/webApp/web
        run: pnpm install --frozen-lockfile

      # Playwright brings its own Chromium rather than reusing a system browser: karma's
      # equivalent step was a long-running source of CHROME_BIN drift, and a pinned download
      # removes the variable entirely.
      # `--with-deps` shells out to apt itself, so it inherits the same black-holed mirror that
      # stalled this step for the job's full 30 minutes on 2026-08-19. The policy is all this job
      # needs — there are no packages to install here, only apt's behaviour to make sane.
      - name: Apply apt mirror and timeout policy
        uses: ./.github/actions/apt-install

      - name: Install Playwright Chromium
        working-directory: app/webApp/web
        timeout-minutes: 12
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Kotest specs in Chromium
        run: ./gradlew :app:webApp:webKotest --no-daemon

  test-web-browser-server:
    name: Test (web browser, server-backed)
    runs-on: ubuntu-latest
    # This lane's proof is the point of the whole branch: a real Chromium playing a
    # server-transcoded book it cannot natively decode, via hls.js, against a real Ktor
    # server. It's a separate job from test-web-browser (not a second Gradle target in that
    # job) because both specs run sync-kotlin.mjs, which collides on
    # `mkdir app/webApp/web/kotlin` with EEXIST if they run concurrently in one invocation —
    # separate jobs also means separate runners, so the collision cannot occur. 45m (vs. the
    # other lane's 30m) because this one also builds :server, generates the seed library, and
    # boots Ktor before Chromium ever opens a page.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/webApp/web/pnpm-lock.yaml

      - name: Install JS toolchain
        working-directory: app/webApp/web
        run: pnpm install --frozen-lockfile

      # Playwright brings its own Chromium rather than reusing a system browser: karma's
      # equivalent step was a long-running source of CHROME_BIN drift, and a pinned download
      # removes the variable entirely.
      # `--with-deps` shells out to apt itself, so it inherits the same black-holed mirror that
      # stalled this step for the job's full 30 minutes on 2026-08-19. The policy is all this job
      # needs — there are no packages to install here, only apt's behaviour to make sane.
      - name: Apply apt mirror and timeout policy
        uses: ./.github/actions/apt-install

      - name: Install Playwright Chromium
        working-directory: app/webApp/web
        timeout-minutes: 12
        run: pnpm exec playwright install --with-deps chromium

      # This lane needs ffmpeg twice over: :server:generateSeedLibrary shells out to it to
      # build the fixture library, and the transcoder under test spawns it per session. A job
      # that proceeded without ffmpeg would fail much later as a confusing hlsUrl == null,
      # rather than here where the cause is obvious. Mirrors the probe/install/verify shape
      # from test-jvm's FFmpeg steps.
      - name: Probe for a preinstalled FFmpeg
        id: ffmpeg-probe
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install FFmpeg (seed library + transcoder)
        if: steps.ffmpeg-probe.outputs.present != 'true'
        timeout-minutes: 16
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg

      # Deliberately fatal, and deliberately OUTSIDE the conditional install above. test-jvm's
      # identical step guards a DIFFERENT failure: there the drift gate skips when ffmpeg is absent,
      # so a missing binary silently no-ops a real test. Here it does not go quiet — it goes
      # confusing. `:server:generateSeedLibrary` `require`s ffmpeg and dies, and if it somehow got
      # past that, the transcoder probes Unavailable and the proof spec fails on `hlsUrl == null`
      # three layers from the cause. This step is what makes the missing binary say so itself.
      - name: Verify FFmpeg is usable (anti-fake-green)
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Run Kotest specs in Chromium against a real server
        run: ./gradlew :app:webApp:webAuthKotest --no-daemon

  test-jvm:
    name: Test (JVM)
    runs-on: ubuntu-latest
    # 45m (matching the macOS lanes) is a safety net for a genuine deadlock. The real cause of the
    # old ~25m stalls / OOM-fails was the Kotlin compiler daemon hitting its -Xmx ceiling on the
    # grown :server source (fixed by raising kotlin.daemon.jvmargs to 6G in gradle.properties), not
    # a timeout or parallelism issue — this runner is the public 4-core/16G tier with RAM to spare.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Drift gate: regenerates localization artifacts from en.json into memory and
      # compares against the committed Android strings.xml + iOS Localizable.xcstrings,
      # failing with a per-file message if en.json was edited without regenerating (or
      # an artifact was hand-edited).
      - name: Verify localization artifacts in sync
        run: ./gradlew :app:sharedUI:verifyStrings --no-daemon

      # Drift gate: regenerates the OSS license manifest from the dependency graph
      # and fails if the committed aboutlibraries.json is out of sync (e.g. a
      # catalog bump landed without re-running exportLibraryDefinitions).
      - name: Verify license manifest in sync
        run: ./gradlew :app:sharedUI:verifyLicenses --no-daemon

      # The Swift half of the localization contract. verifyStrings proves the generated
      # artifacts match en.json but cannot see which keys Swift asks for; iOS renders a
      # missing key as its own text, so a typo ships as visible garbage with nothing red.
      # Xcode also hides it locally by writing the missing key back into the generated
      # catalog as an empty entry. Found 5 live raw-key bugs the day it was added.
      - name: Verify iOS Swift localization keys exist
        run: ./gradlew :app:sharedUI:verifySwiftStringKeys --no-daemon

      # :app:desktopApp is a thin entry-point wrapper over :app:sharedUI/:app:sharedLogic — neither
      # the Android nor the iOS build compiles it, so a shared composable signature
      # change (e.g. #1183) can drift the desktop callers silently until someone builds
      # desktop by hand. Cheap JVM compile; fails fast, ahead of the full test run.
      - name: Compile :app:desktopApp
        run: ./gradlew :app:desktopApp:compileKotlin --no-daemon

      # The web seam check (canon chapters/05-build-order.md): Web is a primary-tier platform, so
      # its seam is gated pre-merge even though no web client exists. The step above already
      # type-checks commonMain against the all-targets-intersection stdlib; what this adds is proof
      # the DEPENDENCY GRAPH publishes js variants, plus real klib codegen rather than a type-check.
      # It has already earned its place twice: it caught KClass.qualifiedName (unsupported on
      # Kotlin/JS) in the RPC channel qualifier, and androidx.sqlite's web/nonWeb suspend split,
      # neither of which the metadata compile can see. Compile only — no jsTest lane is wired.
      - name: Compile shared modules for JS
        run: ./gradlew :contract:compileKotlinJs :app:sharedLogic:compileKotlinJs --no-daemon

      # The transcoder's drift gate (TranscodeIntegrationTest) measures segments a real encoder
      # actually wrote — a mis-declared segment length silently corrupts every position a listener
      # saves, and no fake can catch it. The spec SKIPS when ffmpeg is absent so a developer without
      # one is not blocked, which makes the version check below the anti-fake-green: if the install
      # ever stops landing, the job fails here instead of the gate quietly opting out.
      - name: Probe for a preinstalled FFmpeg
        id: ffmpeg-probe
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install FFmpeg (transcoder drift gate)
        if: steps.ffmpeg-probe.outputs.present != 'true'
        timeout-minutes: 16
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg

      # Deliberately fatal, and deliberately OUTSIDE the conditional install above. The drift gate
      # SKIPS when ffmpeg is absent so a developer without one is not blocked — which means a
      # missing binary would turn the one test that measures real encoder output into a silent
      # no-op. This is the step that refuses to let that pass quietly.
      - name: Verify FFmpeg is usable (anti-fake-green)
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # Kotest across the contract DTOs, the shared client core (every client consumes
      # :app:sharedLogic), and the server. :app:sharedUI host tests are Robolectric (JVM, no
      # emulator) — included here so Compose-UI test rot can't land unnoticed.
      # compileCommonMainKotlinMetadata type-checks :app:sharedLogic commonMain against the COMMON
      # (all-targets-intersection) stdlib, so JVM-only stdlib in shared code (e.g. toSortedSet(),
      # java.*) fails here on Linux instead of late on the macOS iOS lane.
      # :build-logic:convention:test runs the build-logic convention tests, including
      # ReturnValueGuardCanaryTest — the compiler-flag canary that fails if a Kotlin bump
      # silently disarms the AppResult must-use guard.
      # :app:sharedUI:desktopTest is the OTHER sharedUI test source set. It ran nowhere gating
      # until now: no CI step invoked it and none compiled it either, so its eight spec files
      # (the desktop playback controller, the alphabet scrollbar, both haptics suites, typography,
      # colour maths, volume-boost presets) could have been broken for months in silence.
      # :tools:rpc-guard-ksp:test and :build-logic:detekt-rules:test gate the guards themselves.
      # Both suites previously ran nowhere gating (rpc-guard-ksp only under the
      # continue-on-error Kover step; detekt-rules under nothing at all), so the
      # RPC exception-guard processor and the custom detekt rules could rot green —
      # the rules are the only thing enforcing CLAUDE.md security rule 6 (no stacktrace
      # crosses the wire) and the en.json localization contract.
      - name: Run JVM tests
        run: ./gradlew :app:sharedLogic:compileCommonMainKotlinMetadata :contract:jvmTest :app:sharedLogic:jvmTest :app:sharedLogic:testAndroidHostTest :server:jvmTest :app:sharedUI:testAndroidHostTest :app:sharedUI:desktopTest :tools:rpc-guard-ksp:test :build-logic:convention:test :build-logic:detekt-rules:test --no-daemon

      # Generated-and-committed artifacts must match what this build regenerates. Room's
      # schemaDirectory points at the tracked app/sharedLogic/schemas/, so every KSP run rewrites
      # the current version's JSON IN PLACE — an entity change whose regenerated schema was
      # never committed lands green today (CI regenerates it fresh, and the migration tests
      # run against the regenerated copy, not the committed one), leaving the NEXT migration
      # to be authored against a stale schema. strings/licenses have verify* gates; schemas
      # had none. This is the generic backstop: any tracked file the build rewrites fails here.
      - name: Verify no generated-artifact drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Tracked files were modified by the build — commit the regenerated artifacts (see the diff above)."
            exit 1
          fi

      # The E2E retry extensions (app/sharedLogic + server ProjectConfig) absorb transient
      # failures, so a flaking spec can trend worse while runs stay green. Each retry is
      # appended to <module>/build/e2e-retries.log; surface it in the job summary so
      # retries are visible per-PR without failing the build. The RetryExtensionProbe
      # specs retry BY DESIGN every run — filtered out so the summary is signal-only.
      - name: Report E2E auto-retries in job summary
        if: always()
        run: |
          found=0
          for f in app/sharedLogic/build/e2e-retries.log server/build/e2e-retries.log; do
            [ -f "$f" ] || continue
            entries=$(grep -v 'RetryExtensionProbeE2ETest' "$f" || true)
            [ -n "$entries" ] || continue
            if [ "$found" -eq 0 ]; then
              echo '## E2E auto-retries (absorbed by the retry extension)' >> "$GITHUB_STEP_SUMMARY"
              found=1
            fi
            echo "**\`$f\`**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$entries" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$found" -eq 0 ]; then
            echo 'No E2E auto-retries recorded (probe retries excluded).'
          fi

      # Coverage signal (non-gating): every module Kover can measure — the JVM-pure ones
      # (:server, :tools:rpc-guard-ksp) plus the androidKmpLibrary ones (:contract,
      # :app:sharedLogic, :app:sharedUI), which were long assumed unsupported upstream and
      # verified working on 2026-08-04. Client code being unmeasured is how four launch
      # bugs reached main on 2026-08-04 with no coverage signal at all.
      # The XML artifacts enable diff-coverage tooling; there is deliberately NO
      # threshold/verify gate here — this measures, it does not block.
      - name: Generate coverage reports (Kover, non-gating)
        continue-on-error: true
        run: >-
          ./gradlew :server:koverXmlReport :tools:rpc-guard-ksp:koverXmlReport
          :contract:koverXmlReport :app:sharedLogic:koverXmlReport :app:sharedUI:koverXmlReport
          --no-daemon

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kover-coverage
          path: |
            server/build/reports/kover/report.xml
            tools/rpc-guard-ksp/build/reports/kover/report.xml
            contract/build/reports/kover/report.xml
            app/sharedLogic/build/reports/kover/report.xml
            app/sharedUI/build/reports/kover/report.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jvm-test-results
          path: |
            app/sharedLogic/build/reports/tests/
            server/build/reports/tests/
            app/sharedLogic/build/e2e-retries.log
            server/build/e2e-retries.log
          retention-days: 7

  test-ios:
    name: Test (iOS)
    runs-on: macos-26
    # Fail-fast-visible. The iOS test suite is fast (~363 tests in ~35s warm); the time
    # is the cold Kotlin/Native + Swift-Export framework compile + simulator boot. A cold
    # build is well under 30m even with empty Konan/Gradle caches (the post-merge Release
    # build is ~16m cold). 45m leaves comfortable margin for a legitimate cold run while
    # turning a wedged build (which otherwise burns the ~50m default-ish runner ceiling) into
    # a clean, visible failure instead of a silent hang.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.4.1'

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      # The Xcode "Compile Kotlin Framework" run-script hardcodes
      # JAVA_HOME=/opt/homebrew/opt/openjdk@21/... — ensure that path exists.
      - name: Ensure openjdk@21 at the hardcoded path
        run: brew install openjdk@21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Konan (Kotlin/Native)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Resolve a simulator destination
        id: sim
        run: |
          xcrun simctl list devices available | grep iPhone || true
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          cands=[x["name"] for rt,ds in d.items() if "iOS" in rt for x in ds if x["name"].startswith("iPhone")]
          pref=[n for n in cands if n=="iPhone 17"]
          name=pref[0] if pref else sorted(cands, key=lambda s:[int(t) for t in re.findall(r"\d+",s)] or [0])[-1]
          print(name)')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Run iOS tests
        working-directory: app/iosApp
        run: |
          set -o pipefail
          # Per-test timeouts: a hung test (never-completing await / black-hole Flow) fails fast with
          # its own name after 120s instead of freezing the whole run until the 45-min job timeout —
          # which surfaced as an opaque "operation was canceled" with no culprit. Individual tests may
          # opt into longer via executionTimeAllowance, capped at the 300s maximum.
          xcodebuild test \
            -scheme ListenUp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }},OS=latest" \
            -resultBundlePath "$RUNNER_TEMP/ios-test.xcresult" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300

      - name: Upload iOS test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-test.xcresult
          retention-days: 7

      # Gates the iOS Swift Export surface — the flat-typealias layer the patcher
      # appends onto the generated `Shared.swift` (the caller-facing `import Shared`
      # surface), NOT the ObjC `Shared.h`. The xcodebuild step above already
      # generated + patched the SPM package, so the script auto-discovers
      # `app/sharedLogic/build/SPMPackage/**/Shared.swift` and diffs it against the
      # committed baseline (tools/scripts/export-surface-baseline.txt), failing on a banned
      # name or an unreviewed addition. See CLAUDE.md "Export Surface".
      - name: Export-surface inventory (gate)
        if: always()
        run: bash tools/scripts/export-surface-inventory.sh

      - name: No AppResult await from Swift (gate)
        if: always()
        run: bash tools/scripts/check-no-appresult-await.sh

      # The App Intents dependency slot is process-wide, so every test that installs one has to
      # live in a single serialized suite or they race across suites — a rare, expensive-to-attribute
      # flake. This keeps them in one file. See the script's header.
      - name: App Intents tests stay in one suite (gate)
        if: always()
        run: bash tools/scripts/check-intent-tests-single-suite.sh

  # ── Build ────────────────────────────────────────────────────────────────────
  build-server-native:
    name: Build & Test (server linuxX64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate behind lint + JVM tests so a broken compile can't land on a passing test run.
    needs: [lint, test-jvm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Konan (Kotlin/Native)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-

      # The cap is 16m rather than 6m because a cap BELOW one attempt's worst case is not a guard,
      # it is a guillotine: at 6m the 2026-08-19 mirror hang killed the step mid-attempt-1 and the
      # retries this loop exists for never ran at all. The ceiling must clear all three attempts.
      - name: Install native link dependencies (libargon2 + libsqlite3 + libcurl)
        timeout-minutes: 16
        uses: ./.github/actions/apt-install
        with:
          packages: libargon2-dev libsqlite3-dev libcurl4-openssl-dev

      - name: Compile :server linuxX64
        timeout-minutes: 15
        run: ./gradlew :server:compileKotlinLinuxX64 --no-daemon

      # Step-scoped so a wedged test.kexe is attributed to the TEST, not to "the job timed out"
      # — the job ceiling can't tell you which phase hung. Green runs of this lane take 1m50s to
      # 5m37s, so 10m is >2x the slowest observed pass and still fails 3x faster than the job.
      - name: Run :server linuxX64 tests
        timeout-minutes: 10
        run: ./gradlew :server:linuxX64Test --no-daemon

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Don't build the APK unless Kotlin lint + JVM tests pass.
    needs: [lint, test-jvm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build debug APK
        run: ./gradlew :app:androidApp:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-ios:
    name: Build (iOS)
    runs-on: macos-26
    # The expensive Release build is ~16m cold; 45m leaves margin for a slow cold runner
    # while killing a wedge instead of letting it run to the runner ceiling.
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The expensive build (~16m) — gate it behind lint + JVM tests + iOS tests so we
    # never spend it on code that already failed an earlier stage.
    needs: [lint, test-jvm, test-ios]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.4.1'

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure openjdk@21 at the hardcoded path
        run: brew install openjdk@21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Konan (Kotlin/Native)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Build (Release, unsigned)
        working-directory: app/iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme ListenUp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
