name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least-privilege GITHUB_TOKEN for every job — only `packages: read` is added so container jobs
# can pull the pre-baked GHCR CI image (`ghcr.io/listenupapp/listenup-ci`).
permissions:
  contents: read
  packages: read

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is organized into three conceptual stages — Lint, Test, Build — each spanning the
# lanes a stage needs, plus PR path filtering (`changes`) and parallel server sharding.
# Mobile-focused: Linux lane (shared Kotlin + server + Android) and macOS lane (iOS).
# Desktop has no dedicated build/test job, but test-jvm-client compiles :app:desktopApp
# (JVM target) and test-jvm-sharedui runs :app:sharedUI:desktopTest so entry-point or
# shared-composable drift fails fast.
jobs:
  # ── Path filter ──────────────────────────────────────────────────────────────
  changes:
    name: Detect changed lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      server: ${{ steps.filter.outputs.server }}
      sharedui: ${{ steps.filter.outputs.sharedui }}
      web: ${{ steps.filter.outputs.web }}
      web_server: ${{ steps.filter.outputs.web_server }}
      ios_swift: ${{ steps.filter.outputs.ios_swift }}
      sharedlogic: ${{ steps.filter.outputs.sharedlogic }}

    steps:
      - name: Checkout code (PR diff only)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Compute affected CI lanes
        id: filter
        run: |
          set_all() {
            local val="$1"
            for key in server sharedui web web_server ios_swift sharedlogic; do
              echo "${key}=${val}" >> "$GITHUB_OUTPUT"
            done
          }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event (${{ github.event_name }}): enabling all lanes."
            set_all "true"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD") || [ -z "$CHANGED" ]; then
            echo "Diff unavailable or empty: fail-safe enabling all lanes."
            set_all "true"
            exit 0
          fi

          COUNT=$(printf '%s\n' "$CHANGED" | wc -l | tr -d ' ')
          echo "Changed files ($COUNT):"
          printf '%s\n' "$CHANGED"

          if printf '%s\n' "$CHANGED" | grep -qE '^(gradle/|tools/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|\.github/workflows/ci\.yml$|\.github/actions/|contract/)'; then
            echo "Global/build/contract change detected: enabling all lanes."
            set_all "true"
            exit 0
          fi

          check_lane() {
            local key="$1"
            local regex="$2"
            if printf '%s\n' "$CHANGED" | grep -qE "$regex"; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
              echo "  ${key}=true"
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
              echo "  ${key}=false"
            fi
          }

          check_lane server '^server/'
          check_lane sharedui '^(app/sharedUI/|app/sharedLogic/|app/androidApp/|app/desktopApp/)'
          check_lane web '^(app/webApp/|app/sharedLogic/)'
          check_lane web_server '^(app/webApp/|app/sharedLogic/|server/)'
          check_lane ios_swift '^(app/iosApp/|app/sharedLogic/|app/sharedUI/src/commonMain/composeResources/)'
          check_lane sharedlogic '^app/sharedLogic/'

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Lint (Spotless + Detekt)
        run: ./gradlew spotlessCheck detekt --no-daemon

      # The server image's debian:N builders and its distroless *-debianN runtime must move together:
      # every library the builders stage is linked against their glibc. Nothing in CI builds the
      # image, so this is the only thing that sees a Dependabot bump split them. The self-test runs
      # first so a guard that has stopped failing cannot pass silently.
      - name: Server image Debian release guard
        run: |
          bash tools/scripts/check-docker-debian-release.test.sh
          bash tools/scripts/check-docker-debian-release.sh

      # Release's iOS lanes run revoke_ci_dev_certs.py (to stay under Apple's certificate cap) and
      # submit_testflight_beta.py (to send each build to external testers) against App Store
      # Connect. Run their offline tests here so script edits cannot break a release silently.
      - name: Test iOS release scripts
        run: |
          python3 .github/scripts/test_revoke_ci_dev_certs.py
          python3 .github/scripts/test_submit_testflight_beta.py

      # SwiftLint runs on Linux against .swift source (no Xcode needed) via the official
      # container, pinned (0.65.1 — keep CLAUDE.md's local-commands row in sync when bumping).
      # Non-strict: error-severity violations gate; style is advisory. Config: app/iosApp/.swiftlint.yml.
      - name: Run SwiftLint (iOS)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/app/iosApp:/work" -w /work \
            ghcr.io/realm/swiftlint:0.65.1 \
            swiftlint lint --reporter github-actions-logging

      - name: Upload Detekt report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: detekt-report
          path: build/reports/detekt/
          retention-days: 7

  # ── Supply chain ─────────────────────────────────────────────────────────────
  dependency-graph:
    name: Submit dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Overrides the workflow-level `contents: read` — the dependency-graph
      # submission API writes the resolved graph back to the repository.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Review new dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # ── Test ─────────────────────────────────────────────────────────────────────
  test-web-browser:
    name: Test (web browser)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/listenupapp/listenup-ci:latest
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    # The browser lane, first half (`webKotest`): KGP compiles Kotlin to ES modules, then Vite +
    # Playwright own the browser. `test-web-browser-server` below runs the server-backed half.
    # Container pre-bakes JDK 21, Node 24, pnpm, and Playwright Chromium + OS deps.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache pnpm store
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-v1-${{ hashFiles('app/webApp/web/pnpm-lock.yaml') }}

      - name: Restore pnpm store (read-only on PRs)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-v1-${{ hashFiles('app/webApp/web/pnpm-lock.yaml') }}

      - name: Install JS toolchain
        working-directory: app/webApp/web
        run: |
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          pnpm install --frozen-lockfile

      # The OSS licence manifest the web client serves is generated from two dependency graphs —
      # this module's Kotlin/JS one and `web/`'s npm one — so this is the only job with everything
      # needed to regenerate it.
      - name: Verify the web licence manifest is in sync
        run: ./gradlew :app:webApp:verifyWebLicences

      - name: Ensure Playwright Chromium is present
        working-directory: app/webApp/web
        timeout-minutes: 12
        run: |
          if ! node -e "const fs=require('fs'), {chromium}=require('playwright'); process.exit(fs.existsSync(chromium.executablePath()) ? 0 : 1)"; then
            pnpm exec playwright install chromium
          fi

      - name: Run Kotest specs in Chromium
        run: ./gradlew :app:webApp:webKotest

      # The bundle the server image ships. Until this step, it was built and boot-checked only in
      # release.yml, so a minification or precompression regression first surfaced as a blocked release.
      - name: Build and boot-check the production web bundle
        run: ./gradlew :app:webApp:webBundle

  test-web-browser-server:
    name: Test (web browser, server-backed)
    needs: [changes]
    if: needs.changes.outputs.web_server == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/listenupapp/listenup-ci:latest
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    # This lane's proof is the point of the whole branch: a real Chromium playing a
    # server-transcoded book it cannot natively decode, via hls.js, against a real Ktor
    # server. Container pre-bakes JDK 21, Node 24, pnpm, FFmpeg, and Playwright Chromium + OS deps.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore pnpm store (read-only)
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-v1-${{ hashFiles('app/webApp/web/pnpm-lock.yaml') }}

      - name: Install JS toolchain
        working-directory: app/webApp/web
        run: |
          pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
          pnpm install --frozen-lockfile

      - name: Ensure Playwright Chromium is present
        working-directory: app/webApp/web
        timeout-minutes: 12
        run: |
          if ! node -e "const fs=require('fs'), {chromium}=require('playwright'); process.exit(fs.existsSync(chromium.executablePath()) ? 0 : 1)"; then
            pnpm exec playwright install chromium
          fi

      # Deliberately fatal: missing FFmpeg would otherwise surface much later as hlsUrl == null.
      - name: Verify FFmpeg is usable (anti-fake-green)
        run: |
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'

      - name: Run Kotest specs in Chromium against a real server
        run: ./gradlew :app:webApp:webAuthKotest --no-daemon

  test-jvm-client:
    name: 'Test (JVM: client & guards)'
    runs-on: ubuntu-latest
    # Always runs on every PR because `:app:sharedLogic:jvmTest` owns repo-wide Konsist rules
    # and `verifySwiftStringKeys` checks `app/iosApp`. Combined single Gradle invocation avoids
    # paying a second JVM + configuration-cache boot between pre-flight checks and unit tests.
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Combined pre-flight artifact checks + client/contract/build-logic JVM tests:
      # - verifyStrings / verifyLicenses / verifySwiftStringKeys / desktopApp compile / JS klib compile
      # - :contract:jvmTest, :app:sharedLogic:jvmTest
      # - :tools:rpc-guard-ksp:test, :build-logic:convention:test, :build-logic:detekt-rules:test
      - name: Verify artifacts and run client + guard JVM tests
        run: ./gradlew :app:sharedUI:verifyStrings :app:sharedUI:verifyLicenses :app:sharedUI:verifySwiftStringKeys :app:desktopApp:compileKotlin :contract:compileKotlinJs :app:sharedLogic:compileKotlinJs :app:sharedLogic:compileCommonMainKotlinMetadata :contract:jvmTest :app:sharedLogic:jvmTest :tools:rpc-guard-ksp:test :build-logic:convention:test :build-logic:detekt-rules:test

      # Generated-and-committed artifacts must match what this build regenerates. Room's
      # schemaDirectory points at the tracked app/sharedLogic/schemas/, so every KSP run rewrites
      # the current version's JSON IN PLACE — an entity change whose regenerated schema was
      # never committed lands green today, leaving the next migration against a stale schema.
      - name: Verify no generated-artifact drift
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            git diff
            echo "::error::The build modified or created files — commit the regenerated artifacts (listed above)."
            exit 1
          fi

      # The E2E retry extension appends to app/sharedLogic/build/e2e-retries.log; surface it
      # per-PR without failing the build (Probe spec retries by design).
      - name: Report E2E auto-retries in job summary
        if: always()
        run: |
          f="app/sharedLogic/build/e2e-retries.log"
          if [ -f "$f" ]; then
            entries=$(grep -v 'RetryExtensionProbeE2ETest' "$f" || true)
            if [ -n "$entries" ]; then
              echo '## E2E auto-retries (absorbed by the retry extension)' >> "$GITHUB_STEP_SUMMARY"
              echo "**\`$f\`**" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$entries" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'No E2E auto-retries recorded (probe retries excluded).'

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-jvm-test-results
          path: |
            app/sharedLogic/build/reports/tests/
            app/sharedLogic/build/e2e-retries.log
          retention-days: 7
          if-no-files-found: ignore

  test-jvm-sharedui:
    name: 'Test (JVM: sharedUI)'
    needs: [changes]
    if: needs.changes.outputs.sharedui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run sharedUI Android host and desktop tests
        run: ./gradlew :app:sharedUI:testAndroidHostTest :app:sharedUI:desktopTest

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sharedui-jvm-test-results
          path: app/sharedUI/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  test-jvm-sharedlogic-android:
    name: 'Test (JVM: sharedLogic Android)'
    needs: [changes]
    if: needs.changes.outputs.sharedlogic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run sharedLogic Android host tests
        run: ./gradlew :app:sharedLogic:testAndroidHostTest

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sharedlogic-android-test-results
          path: app/sharedLogic/build/reports/tests/testAndroidHostTest/
          retention-days: 7
          if-no-files-found: ignore

  test-jvm-server:
    name: 'Test (JVM: server ${{ matrix.shard }}/3)'
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/listenupapp/listenup-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GRADLE_USER_HOME: /home/ubuntu/.gradle
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Anti-fake-green: fail fast if FFmpeg or GStreamer + FDK is missing from the container image.
      - name: Verify FFmpeg is usable (anti-fake-green)
        run: |
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'

      - name: Verify GStreamer FDK decoding (anti-fake-green)
        run: |
          gst-inspect-1.0 fdkaacdec | sed -n '1,3p'
          gst-inspect-1.0 matroskademux | sed -n '1,3p'
          ldd_out="$(ldd /opt/listenup/gst-plugins/libgstfdkaac.so)"
          printf '%s\n' "$ldd_out" | grep -F "/opt/listenup/gst-plugins/fdk-aac/lib/libfdk-aac"

      # Several server suites verify EACCES against chmod 0555/0000 directories; root ignores POSIX mode bits via CAP_DAC_OVERRIDE.
      # Never chown $RUNNER_TEMP itself: the host runner (UID 1001) reads $RUNNER_TEMP/_github_workflow/event.json between steps.
      - name: Prepare non-root user for POSIX permission tests
        run: |
          id ubuntu >/dev/null 2>&1 || useradd -m -s /bin/bash ubuntu
          mkdir -p "$GRADLE_USER_HOME" "$RUNNER_TEMP/.gradle-actions/build-results"
          chown -R ubuntu:ubuntu "$GITHUB_WORKSPACE" "$GRADLE_USER_HOME"
          chmod -R a+rwX "$RUNNER_TEMP/.gradle-actions"

      - name: Run server Konsist and shard 1/3 tests
        if: matrix.shard == 1
        run: runuser -u ubuntu -m -- env HOME=/home/ubuntu ./gradlew :server:konsistTest :server:jvmTest -PserverTestShard=1/3

      - name: Run server shard tests
        if: matrix.shard != 1
        run: runuser -u ubuntu -m -- env HOME=/home/ubuntu ./gradlew :server:jvmTest -PserverTestShard=${{matrix.shard}}/3

      - name: Report E2E auto-retries in job summary
        if: always()
        run: |
          f="server/build/e2e-retries.log"
          if [ -f "$f" ]; then
            entries=$(grep -v 'RetryExtensionProbeE2ETest' "$f" || true)
            if [ -n "$entries" ]; then
              echo '## E2E auto-retries (absorbed by the retry extension)' >> "$GITHUB_STEP_SUMMARY"
              echo "**\`$f\`**" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              echo "$entries" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'No E2E auto-retries recorded (probe retries excluded).'

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-jvm-test-results-shard-${{ matrix.shard }}
          path: |
            server/build/reports/tests/
            server/build/e2e-retries.log
          retention-days: 7
          if-no-files-found: ignore

  coverage:
    name: Coverage (Kover)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-jvm-client, test-jvm-sharedui, test-jvm-sharedlogic-android, test-jvm-server]
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Probe for a preinstalled FFmpeg
        id: ffmpeg-probe
        run: |
          pkgs="gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good"
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            pkgs="ffmpeg $pkgs"
          fi
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

      - name: Install FFmpeg and GStreamer runtime
        timeout-minutes: 18
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ steps.ffmpeg-probe.outputs.packages }}

      - name: Read GStreamer version for FDK plugin cache key
        id: gst-version
        run: |
          version="$(gst-inspect-1.0 --version | sed -n 's/.*GStreamer \([0-9][0-9.]*\).*/\1/p' | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore GStreamer fdkaacdec plugin
        id: gst-cache-ro
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/gst-plugins
          key: ${{ runner.os }}-${{ runner.arch }}-gst-fdkaac-v1-${{ steps.gst-version.outputs.version }}-${{ hashFiles('tools/scripts/build-gst-fdkaac.sh') }}

      - name: Export GStreamer plugin path
        if: steps.gst-cache-ro.outputs.cache-hit == 'true'
        run: echo "GST_PLUGIN_PATH=$RUNNER_TEMP/gst-plugins" >> "$GITHUB_ENV"

      # Coverage signal (non-gating, main-only): every module Kover can measure.
      - name: Generate coverage reports (Kover, non-gating)
        continue-on-error: true
        run: ./gradlew :server:koverXmlReport :tools:rpc-guard-ksp:koverXmlReport :contract:koverXmlReport :app:sharedLogic:koverXmlReport :app:sharedUI:koverXmlReport

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kover-coverage
          path: |
            server/build/reports/kover/report.xml
            tools/rpc-guard-ksp/build/reports/kover/report.xml
            contract/build/reports/kover/report.xml
            app/sharedLogic/build/reports/kover/report.xml
            app/sharedUI/build/reports/kover/report.xml
          retention-days: 7
          if-no-files-found: ignore

  test-ios-swift:
    name: 'Test (iOS: Swift)'
    needs: [changes]
    if: needs.changes.outputs.ios_swift == 'true'
    runs-on: xcode-27
    # Main builds snapshot Swift Export outputs ($RUNNER_TEMP/swift-export-cache + Shared.swift)
    # and Xcode's CompilationCache.noindex so Swift-only PRs restore both read-only and skip the
    # ~20m Kotlin/Native + Swift Export build. Tests reuse the booted simulator serially
    # (-parallel-testing-enabled NO) to skip clone boot and avoid parallel clone CPU contention.
    # 60m still bounds cold cache-miss runs (Kotlin bumps or first build after key change).
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '27.1'

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # SwiftExportAction can OOM at the repo-wide 4G Gradle daemon heap on 16G macOS runners.
      - name: Raise Gradle daemon heap for Swift Export
        run: |
          mkdir -p ~/.gradle
          printf '\norg.gradle.jvmargs=-Xmx6144M -Dfile.encoding=UTF-8\n' >> ~/.gradle/gradle.properties

      - name: Read Kotlin version for Konan cache key
        id: kotlin-version
        run: |
          version="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed solely on the Kotlin version (not all of libs.versions.toml) so unrelated
      # dependency bumps don't invalidate ~600 MB of Kotlin/Native toolchains, and read-only on
      # PRs (matching setup-gradle) so PR branches don't duplicate ~/.konan and evict main's cache.
      - name: Cache Konan (Kotlin/Native)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-v1-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Restore Konan (Kotlin/Native, read-only on PRs)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-v1-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Cache SwiftPM packages
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/spm-packages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v1-${{ hashFiles('app/iosApp/ListenUp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Restore SwiftPM packages (read-only on PRs)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/spm-packages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v1-${{ hashFiles('app/iosApp/ListenUp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Exact key only (no restore-keys): stale Swift Export products must never mask Kotlin/contract changes.
      - name: Cache Swift Export outputs
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/swift-export-cache
            app/sharedLogic/build/SPMPackage/iosSimulatorArm64/Debug/Sources/Shared/Shared.swift
          key: ${{ runner.os }}-${{ runner.arch }}-xcode27.1-swiftexport-v1-${{ hashFiles('VERSION', 'gradle/libs.versions.toml', 'contract/**', 'app/sharedLogic/**', 'tools/build-logic/**') }}

      - name: Restore Swift Export outputs (read-only on PRs)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/swift-export-cache
            app/sharedLogic/build/SPMPackage/iosSimulatorArm64/Debug/Sources/Shared/Shared.swift
          key: ${{ runner.os }}-${{ runner.arch }}-xcode27.1-swiftexport-v1-${{ hashFiles('VERSION', 'gradle/libs.versions.toml', 'contract/**', 'app/sharedLogic/**', 'tools/build-logic/**') }}

      - name: Cache Xcode compilation cache (CAS)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-${{ runner.arch }}-xcode27.1-cas-v1-${{ hashFiles('app/iosApp/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode27.1-cas-v1-

      - name: Restore Xcode compilation cache (CAS, read-only on PRs)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-${{ runner.arch }}-xcode27.1-cas-v1-${{ hashFiles('app/iosApp/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode27.1-cas-v1-

      - name: Resolve a simulator destination
        id: sim
        run: |
          xcrun simctl list devices available | grep iPhone || true
          DEVICE=$(xcrun simctl list devices available --json \
            | python3 -c '
          import json,sys,re
          d=json.load(sys.stdin)["devices"]
          cands=[x["name"] for rt,ds in d.items() if "iOS" in rt for x in ds if x["name"].startswith("iPhone")]
          pref=[n for n in cands if n=="iPhone 17"]
          name=pref[0] if pref else sorted(cands, key=lambda s:[int(t) for t in re.findall(r"\d+",s)] or [0])[-1]
          print(name)')
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

      - name: Run iOS tests
        working-directory: app/iosApp
        run: |
          set -o pipefail
          # Per-test timeouts: a hung test (never-completing await / black-hole Flow) fails fast with
          # its own name after 120s instead of freezing the whole run.
          xcodebuild test \
            -scheme ListenUp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }},OS=latest" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-packages" \
            -resultBundlePath "$RUNNER_TEMP/ios-test.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            LISTENUP_SWIFT_EXPORT_CACHE_DIR="$RUNNER_TEMP/swift-export-cache" \
            COMPILATION_CACHE_ENABLE_CACHING=YES

      - name: Upload iOS test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-test.xcresult
          retention-days: 7

      # Gates the iOS Swift Export surface generated + patched during xcodebuild above.
      - name: Export-surface inventory (gate)
        if: always()
        run: bash tools/scripts/export-surface-inventory.sh

      - name: No AppResult await from Swift (gate)
        if: always()
        run: bash tools/scripts/check-no-appresult-await.sh

      # The App Intents dependency slot is process-wide, so every test that installs one has to
      # live in a single serialized suite or they race across suites.
      - name: App Intents tests stay in one suite (gate)
        if: always()
        run: bash tools/scripts/check-intent-tests-single-suite.sh

  test-ios-kotlin:
    name: 'Test (iOS: sharedLogic Kotlin)'
    needs: [changes]
    if: needs.changes.outputs.sharedlogic == 'true'
    runs-on: xcode-27
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '27.1'

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Read Kotlin version for Konan cache key
        id: kotlin-version
        run: |
          version="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Restore-only here because test-ios-swift saves ~/.konan on main (avoids concurrent cache races).
      - name: Restore Konan (Kotlin/Native, read-only)
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-v1-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Run shared Kotlin tests on the iOS simulator
        run: ./gradlew :app:sharedLogic:iosSimulatorArm64Test

  # ── Build ────────────────────────────────────────────────────────────────────
  build-server-native:
    name: Build & Test (server linuxX64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/listenupapp/listenup-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    timeout-minutes: 30
    # Gate behind lint only so native compile + test run in parallel with test-jvm-server.
    needs: [changes, lint]
    if: needs.changes.outputs.server == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Read Kotlin version for Konan cache key
        id: kotlin-version
        run: |
          version="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Keyed solely on the Kotlin version (not all of libs.versions.toml) so unrelated
      # dependency bumps don't invalidate ~600 MB of Kotlin/Native toolchains, and read-only on
      # PRs (matching setup-gradle) so PR branches don't duplicate ~/.konan and evict main's cache.
      - name: Cache Konan (Kotlin/Native)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-v1-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Restore Konan (Kotlin/Native, read-only on PRs)
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-v1-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Verify native link dependencies (anti-fake-green)
        run: pkg-config --modversion libargon2 sqlite3 libcurl

      # Compile both linuxX64 and linuxArm64 (Raspberry Pi / Graviton rot canary — compile-only
      # because linking requires aarch64 libs; fetches the aarch64 sysroot when Konan misses).
      - name: Compile :server linuxX64 and linuxArm64 (rot canary)
        timeout-minutes: 20
        run: ./gradlew :server:compileKotlinLinuxX64 :server:compileKotlinLinuxArm64

      # Step-scoped so a wedged test.kexe is attributed to the TEST, not to "the job timed out"
      # — the job ceiling can't tell you which phase hung. Covers both :server and :contract
      # native specs in a single Gradle invocation reusing the warm daemon above.
      - name: Run :server and :contract linuxX64 tests
        timeout-minutes: 15
        run: ./gradlew :server:linuxX64Test :contract:linuxX64Test

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Don't build the APK unless Kotlin lint + client/sharedUI/sharedLogic JVM tests pass.
    needs: [lint, test-jvm-client, test-jvm-sharedui, test-jvm-sharedlogic-android]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # CI also exercises a minified build (`benchmarkRelease`): `isMinifyEnabled` is scoped to
      # `release` (which needs the Play keystore), while `benchmarkRelease` derives from `release`
      # (minified + resource-shrunk) and is reassigned to the debug signing config in
      # app/androidApp/build.gradle.kts so it builds keyless.
      - name: Build debug and minified canary APKs
        run: ./gradlew :app:androidApp:assembleDebug :app:androidApp:assembleBenchmarkRelease --no-daemon

      # The gate that exists because ListenUp 0.8.0 shipped an app that could not reach ANY server
      # — R8 renamed the @Rpc interfaces its client resolves by name. It used to run only in
      # release.yml, after the release was already being built; here it catches the regression on
      # the merge that introduced it instead.
      - name: Verify @Rpc surface survived R8
        run: bash tools/scripts/verify-r8-rpc-surface.sh app/androidApp/build/outputs/apk/benchmarkRelease/androidApp-benchmarkRelease.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-ios:
    name: Build (iOS)
    runs-on: xcode-27
    # The expensive Release build is ~16m cold; 45m leaves margin for a slow cold runner
    # while killing a wedge instead of letting it run to the runner ceiling.
    timeout-minutes: 45
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The expensive build (~16m) — gate it behind lint + client/iOS tests so we
    # never spend it on code that already failed an earlier stage.
    needs: [lint, test-jvm-client, test-ios-swift, test-ios-kotlin]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '27.1'

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Read Kotlin version for Konan cache key
        id: kotlin-version
        run: |
          version="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Konan (Kotlin/Native)
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-konan-v1-${{ steps.kotlin-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-konan-v1-
            ${{ runner.os }}-konan-

      - name: Restore SwiftPM packages
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/spm-packages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v1-${{ hashFiles('app/iosApp/ListenUp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build (Release, unsigned)
        working-directory: app/iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme ListenUp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-packages" \
            CODE_SIGNING_ALLOWED=NO
