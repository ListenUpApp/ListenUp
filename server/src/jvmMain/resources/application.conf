ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.calypsan.listenup.server.ApplicationKt.module ]
    }
}

app {
    # Instance display name, shown on the public invite landing page. Defaults to
    # "ListenUp" when unset or blank.
    serverName = "ListenUp"
    serverName = ${?LISTENUP_SERVER_NAME}
}

database {
    # Blank by default: the server stores its SQLite database at
    # $LISTENUP_HOME/listenup.db, where LISTENUP_HOME defaults to ~/ListenUp
    # (resolved in code — HOCON cannot expand ~ or $HOME). Set LISTENUP_HOME to
    # relocate all application data. Tests inject an explicit jdbcUrl directly.
    jdbcUrl = ""
}

auth {
    # Server-side pepper for HMAC-SHA-256 of refresh tokens. Leave this default
    # unset (no LISTENUP_REFRESH_PEPPER) and the server generates a secure pepper
    # on first boot, persisting it to $LISTENUP_HOME/secrets.properties and reusing
    # it forever after. Set LISTENUP_REFRESH_PEPPER to pin an explicit 32+ byte
    # secret; an explicit value that is this default or under 32 bytes fails startup.
    # Rotating the pepper invalidates every stored hash and forces re-authentication.
    refreshPepper = "test-pepper-change-in-production-this-must-be-32-bytes-or-more"
    refreshPepper = ${?LISTENUP_REFRESH_PEPPER}
}

jwt {
    # HS256 signing secret, at least 32 bytes. Leave this default unset (no
    # LISTENUP_JWT_SECRET) and the server generates a secure secret on first boot,
    # persisting it to $LISTENUP_HOME/secrets.properties. Set LISTENUP_JWT_SECRET to
    # pin an explicit value; an explicit value that is this default or under 32 bytes
    # fails startup.
    secret = "test-jwt-secret-change-in-production-at-least-32-bytes-please"
    secret = ${?LISTENUP_JWT_SECRET}
    issuer = "listenup"
    audience = "listenup-client"
}

registration {
    # OPEN | APPROVAL_QUEUE | CLOSED. Drives register() branching in AuthService.
    # Defaults to APPROVAL_QUEUE: a fresh self-hosted server requires admin approval
    # of new sign-ups rather than admitting anyone immediately.
    policy = "APPROVAL_QUEUE"
    policy = ${?LISTENUP_REGISTRATION_POLICY}
}

scanner {
    # OS-path-separator-delimited list of absolute folder paths to seed as folders
    # of the singleton library on first boot (e.g. "/audio/books:/audio/podcasts"
    # on Unix, "/audio/books;/audio/podcasts" on Windows). Each entry must point to
    # an existing directory; non-directory entries are skipped with a warning.
    # If unset (empty), the server starts with a path-less library; folders can be
    # added later via the LibraryAdmin RPC/REST surface.
    libraryPath = ""
    libraryPath = ${?LISTENUP_LIBRARY_PATH}

    # Textual-metadata precedence — a comma-separated, highest-first list of
    # signal sources: metadata.json, embedded, sidecar, filename, folder. A
    # source left out is never consulted. Blank uses the default order shown.
    # An invalid token fails server startup loud.
    metadataPrecedence = ""
    metadataPrecedence = ${?LISTENUP_METADATA_PRECEDENCE}

    # Maximum number of embedded-artwork covers held in the in-memory LRU cache.
    # ~1000 covers at a few KB each is a negligible heap footprint; raise it for
    # very large libraries with heavy cover browsing.
    embeddedCoverCacheSize = 1000
    embeddedCoverCacheSize = ${?LISTENUP_EMBEDDED_COVER_CACHE_SIZE}
}

seed {
    profile = ""
    profile = ${?LISTENUP_SEED_PROFILE}
}

server {
    # Take an exclusive OS lock on the data directory ($LISTENUP_HOME) at startup so two server
    # processes can never share one data home and race the scan-spool — the cause of #703's
    # spooled-cover 404s (a stale JVM + a fresh boot whose sweep deletes the live scan's covers).
    # A second instance on the same data dir fails fast with a clear message instead of corrupting.
    # Tests run on isolated in-memory configs that omit this key, so the lock is off there.
    dataDirLock = true
    dataDirLock = ${?LISTENUP_DATA_DIR_LOCK}
}

scan {
    # Re-walk every library once on startup to catch changes made while the server was down.
    rescanOnStartup = true
    rescanOnStartup = ${?LISTENUP_SCAN_RESCAN_ON_STARTUP}

    # Periodic full-rescan backstop interval (Kotlin Duration format, e.g. "6h", "30m").
    # "0" or blank disables the periodic loop; the live watcher still runs.
    periodicRescanInterval = "6h"
    periodicRescanInterval = ${?LISTENUP_SCAN_PERIODIC_RESCAN_INTERVAL}
}

web {
    # Directory holding the bundled web client (app/webApp/web -> `vite build` output).
    # Unset means no web route is mounted at all, and / returns 404 — the correct behaviour
    # for a server image built without the web bundle.
    root = ""
    root = ${?LISTENUP_WEB_ROOT}
}

transcode {
    # Probe for a usable FFmpeg once at startup. Off means the server never transcodes — it still
    # serves originals, it just cannot rescue a codec the client can't decode. Tests set this false
    # so the transcoding surface doesn't depend on whether the host has FFmpeg installed.
    probeOnStartup = true
    probeOnStartup = ${?LISTENUP_TRANSCODE_PROBE_ON_STARTUP}

    # Total bytes the HLS segment cache may occupy. "0" disables transcoding entirely —
    # the documented off switch, rather than a cache that evicts everything instantly.
    cacheCapBytes = 10737418240
    cacheCapBytes = ${?LISTENUP_TRANSCODE_CACHE_BYTES}

    # Admission gate on concurrent FFmpeg sessions, not a queue: requests over the cap are
    # refused with a retryable busy rather than made to wait.
    maxConcurrentSessions = 2
    maxConcurrentSessions = ${?LISTENUP_TRANSCODE_MAX_SESSIONS}

    # AAC-LC target bitrate. Channel count is preserved and the sample rate is never resampled.
    bitrateKbps = 64
    bitrateKbps = ${?LISTENUP_TRANSCODE_BITRATE_KBPS}
}
