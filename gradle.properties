#Kotlin
kotlin.code.style=official
# 6G: the back-end codegen of the largest commonMain units (the grown :server KMP source)
# OOMs the compiler daemon at the old 3G ceiling regardless of total RAM (the CI runner has
# 16G free). Raised to give comfortable headroom; local dev machines have ample RAM for it.
kotlin.daemon.jvmargs=-Xmx6144M
# Note: kotlin.incremental.useClasspathSnapshot removed - deprecated in Kotlin 2.3+
# Kotlin now uses ABI snapshots by default for incremental compilation
# The :server linuxX64 test/run tasks can't execute on a macOS host (cross-compile target).
# They still build on Linux/CI; this silences the "Native task ... is disabled" config noise.
kotlin.native.ignoreDisabledTargets=true
# The shared :server linuxMain source set (parent of linuxX64Main + linuxArm64Main) uses the
# libargon2 + sqlite3 cinterops, which both linux targets declare identically. Commonization
# generates a single target-agnostic view of those C APIs for the shared set, so it resolves in
# the IDE / shared-metadata compile instead of showing unresolved references. Per-target Gradle
# compilation worked without it; this fixes the shared-source-set view and silences the warning.
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Incremental compilation of klib artifacts (Beta in Kotlin 2.4.20). Measured on Kit, 2026-09-09:
# a one-file change relinks the iOS simulator framework in 34s instead of 49s, the first link
# costs nothing extra (38s vs 39s) and leaves a 92 MB per-file cache under build/. The three
# native lanes — :app:sharedLogic's iosSimulatorArm64 test binary and :server's linuxX64 test +
# release link — spend most of their wall time in exactly that link.
kotlin.incremental.native=true
